# Builds everything DroidVim runs on the device for 4 Android ABIs and
# packages it into an installable APK:
#
# - Vim and xxd (latest patched Vim source, NDK, static deps) + runtime files
# - grep, diff (GNU) and Universal Ctags, built the same way
# - bash/readline/ncurses, zip/unzip, busybox, proot and termux-am, built
#   with termux-packages for the app package name com.droidvim (the way
#   DroidVim's original binaries were made) and repackaged by
#   .github/droidvim-pack.py
# - optionally git and Python (with pip), also from termux-packages
# - DroidVim's helper scripts from payload/scripts
#
# Building grep/diff/ctags and the Termux tools is optional; when switched
# off, the prebuilt copies already in the repository are used.
# App resources (layouts, strings, DroidVim's settings archives) still come
# from the repository; .github/check-payload.sh lists anything missing.
#
# Runs on every push, or from the Actions tab ("Run workflow") with options.
# Defaults for push builds can be changed with repository variables
# (Settings > Secrets and variables > Actions > Variables):
#   BUILD_CMD_TOOLS, BUILD_TERMUX_TOOLS, WITH_GIT, WITH_PYTHON = true/false

name: Build Vim for Android + DroidVim APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      vim_ref:
        description: Vim tag, branch or commit to build (e.g. v9.2.0501)
        required: true
        default: v9.2.0501
      android_api:
        description: Minimum Android API level (keep equal to minSdk in build.gradle)
        required: true
        default: '21'
      enable_nls:
        description: Build with translations (+gettext; builds GNU libintl)
        type: boolean
        default: true
      enable_lua:
        description: Add the Lua interpreter (+lua; builds Lua statically)
        type: boolean
        default: false
      extra_configure_flags:
        description: Extra flags for Vim's configure (space separated)
        required: false
        default: ''
      allow_patch_failures:
        description: Skip DroidVim patches that no longer apply instead of failing
        type: boolean
        default: false
      build_cmd_tools:
        description: Build grep, diff and ctags from source (off = use the repo's prebuilt ones)
        type: boolean
        default: true
      build_termux_tools:
        description: Build bash, zip, busybox, proot, am (+ git/python) with termux-packages (off = use the repo's prebuilt ones)
        type: boolean
        default: true
      extra_tools:
        description: Extra tools to include (needs the Termux tools build)
        type: choice
        options:
          - git and python
          - git
          - python
          - none
        default: git and python
      termux_packages_ref:
        description: termux-packages branch, tag or commit for the Termux tools
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VIM_REPO: https://github.com/vim/vim.git
  VIM_REF: ${{ inputs.vim_ref || 'v9.2.0501' }}
  ANDROID_API: ${{ inputs.android_api || '21' }}
  ENABLE_NLS: ${{ inputs.enable_nls != false }}
  ENABLE_LUA: ${{ inputs.enable_lua == true }}
  ALLOW_PATCH_FAILURES: ${{ inputs.allow_patch_failures == true }}
  EXTRA_CONFIGURE_FLAGS: ${{ inputs.extra_configure_flags }}
  NDK_VERSION: r26d
  NCURSES_VERSION: '6.5'
  LIBICONV_VERSION: '1.17'
  GETTEXT_VERSION: '0.22.5'
  LUA_VERSION: '5.4.6'
  # Bump to throw away cached dependency builds (needed whenever the way a
  # dependency is compiled changes, since the cache key only covers versions
  # and options).
  DEPS_CACHE_REV: '2'
  # Command-line tools: 'latest' looks up the newest release at build time.
  GREP_VERSION: latest
  DIFFUTILS_VERSION: latest
  CTAGS_VERSION: latest
  TERMUX_PACKAGES_REF: ${{ inputs.termux_packages_ref || 'master' }}
  DROIDVIM_PACKAGE: com.droidvim
  # Optional parts: the Run workflow choice, else a repository variable,
  # else on.
  BUILD_CMD_TOOLS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.build_cmd_tools) || vars.BUILD_CMD_TOOLS || 'true' }}
  BUILD_TERMUX_TOOLS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.build_termux_tools) || vars.BUILD_TERMUX_TOOLS || 'true' }}
  WITH_GIT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', contains(inputs.extra_tools, 'git')) || vars.WITH_GIT || 'true' }}
  WITH_PYTHON: ${{ github.event_name == 'workflow_dispatch' && format('{0}', contains(inputs.extra_tools, 'python')) || vars.WITH_PYTHON || 'true' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fetch Vim and apply DroidVim's patches once, so every later job builds
  #    exactly the same source.
  # ---------------------------------------------------------------------------
  prepare-source:
    runs-on: ubuntu-latest
    outputs:
      vim_version: ${{ steps.version.outputs.vim_version }}
      build_termux_tools: ${{ steps.options.outputs.build_termux_tools }}
    steps:
      - name: Build options
        id: options
        run: |
          set -euo pipefail
          for v in BUILD_CMD_TOOLS BUILD_TERMUX_TOOLS WITH_GIT WITH_PYTHON; do
            case "${!v}" in
              true|false) ;;
              *) echo "::error::$v must be true or false, not '${!v}'"; exit 1;;
            esac
          done
          echo "build_termux_tools=$BUILD_TERMUX_TOOLS" >> "$GITHUB_OUTPUT"
          {
            echo "### Build options"
            echo "| Part | Built from source |"
            echo "| --- | --- |"
            echo "| Vim $VIM_REF + runtime | always |"
            echo "| grep, diff, ctags | $BUILD_CMD_TOOLS |"
            echo "| bash, zip/unzip, busybox, proot, am | $BUILD_TERMUX_TOOLS |"
            echo "| git | $([ "$BUILD_TERMUX_TOOLS" = true ] && echo "$WITH_GIT" || echo false) |"
            echo "| Python 3 + pip | $([ "$BUILD_TERMUX_TOOLS" = true ] && echo "$WITH_PYTHON" || echo false) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_TERMUX_TOOLS" != true ] && { [ "$WITH_GIT" = true ] || [ "$WITH_PYTHON" = true ]; }; then
            echo "::notice::git and Python are only added when the Termux tools are built."
          fi

      - uses: actions/checkout@v4
        with:
          path: droidvim

      - name: Check the DroidVim tree is complete
        working-directory: droidvim
        run: bash .github/check-payload.sh || echo "::warning::The repository is missing DroidVim resources (see the log of this step); the binaries will still be built, but the APK job will fail."

      - name: Clone Vim
        run: |
          set -euo pipefail
          git clone --quiet --filter=tree:0 --no-checkout "$VIM_REPO" vim
          git -C vim checkout --quiet "$VIM_REF"
          git -C vim log -1 --format='Building Vim %H (%cs) %s'

      - name: Apply DroidVim patches
        run: |
          set -euo pipefail
          cd vim
          failed=()
          for patch in ../droidvim/patches/*.patch; do
            name=$(basename "$patch")
            if git apply --check "$patch" 2>/dev/null; then
              git apply "$patch"
              echo "Applied $name"
              continue
            fi
            # The upstream E137 patch targets older viminfo.c; the same change
            # (skip the Unix file-owner check on Android) is made here in a
            # way that survives Vim's later refactoring of that function.
            if [ "$name" = vim-e137-viminfo.patch ]; then
              perl -0pi -e 's/^#ifdef UNIX\n(\s*\/\/ For Unix we check the owner of the file)/#if defined(UNIX) \&\& !defined(__ANDROID__)\n$1/m' src/viminfo.c
              if grep -q 'defined(UNIX) && !defined(__ANDROID__)' src/viminfo.c; then
                echo "Applied $name (ported to this Vim version)"
                continue
              fi
            fi
            failed+=("$name")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            for name in "${failed[@]}"; do
              if [ "$ALLOW_PATCH_FAILURES" = true ]; then
                echo "::warning::Patch $name does not apply to $VIM_REF and was skipped"
              else
                echo "::error::Patch $name does not apply to $VIM_REF (re-run with allow_patch_failures, or update the patch)"
              fi
            done
            [ "$ALLOW_PATCH_FAILURES" = true ] || exit 1
          fi
          git diff > ../droidvim-applied.diff
          git diff --stat

      - name: Determine Vim version
        id: version
        run: |
          set -euo pipefail
          version=$(git -C vim describe --tags --always)
          version=${version#v}
          echo "vim_version=$version" >> "$GITHUB_OUTPUT"
          echo "Vim version: $version"

      - name: Pack patched source
        run: tar --exclude=.git -czf vim-src.tar.gz vim droidvim-applied.diff

      - uses: actions/upload-artifact@v4
        with:
          name: vim-src
          path: vim-src.tar.gz
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2. Cross-compile Vim (and xxd) for each Android ABI.
  # ---------------------------------------------------------------------------
  vim-binary:
    needs: prepare-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            host: aarch64-linux-android
            uname_m: aarch64
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi
            host: arm-linux-androideabi
            uname_m: armv7l
          - abi: x86_64
            target: x86_64-linux-android
            host: x86_64-linux-android
            uname_m: x86_64
          - abi: x86
            target: i686-linux-android
            host: i686-linux-android
            uname_m: i686
    env:
      ABI: ${{ matrix.abi }}
      TARGET: ${{ matrix.target }}
      HOST: ${{ matrix.host }}
      UNAME_M: ${{ matrix.uname_m }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vim-src

      - name: Unpack source
        run: tar -xzf vim-src.tar.gz

      - name: Install host tools
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext pkg-config

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Configure toolchain
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          tc="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$tc"
            echo "CC=$tc/bin/${TARGET}${ANDROID_API}-clang"
            echo "AR=$tc/bin/llvm-ar"
            echo "RANLIB=$tc/bin/llvm-ranlib"
            echo "STRIP=$tc/bin/llvm-strip"
            echo "READELF=$tc/bin/llvm-readelf"
            echo "PREFIX=$GITHUB_WORKSPACE/deps/$ABI"
            echo "JOBS=$(nproc)"
            # 32-bit Android below API 24 lacks several 64-bit file offset
            # functions, so build those ABIs without large-file support.
            if { [ "$ABI" = armeabi-v7a ] || [ "$ABI" = x86 ]; } && [ "$ANDROID_API" -lt 24 ]; then
              echo "LARGEFILE_FLAG=--disable-largefile"
            else
              echo "LARGEFILE_FLAG="
            fi
          } >> "$GITHUB_ENV"
          "$tc/bin/${TARGET}${ANDROID_API}-clang" --version

      - name: Restore cached dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps/${{ matrix.abi }}
          key: android-deps-${{ matrix.abi }}-api${{ env.ANDROID_API }}-ndk${{ env.NDK_VERSION }}-ncurses${{ env.NCURSES_VERSION }}-iconv${{ env.LIBICONV_VERSION }}-nls${{ env.ENABLE_NLS }}-gettext${{ env.GETTEXT_VERSION }}-lua${{ env.ENABLE_LUA }}-${{ env.LUA_VERSION }}-r${{ env.DEPS_CACHE_REV }}

      - name: Build static dependencies (ncurses, libiconv, libintl, Lua)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX" build
          cd build
          export CFLAGS="-O2 -fPIC"
          lf=()
          if [ -n "$LARGEFILE_FLAG" ]; then lf=("$LARGEFILE_FLAG"); fi

          fetch_gnu() {
            local path=$1
            for base in https://ftpmirror.gnu.org https://ftp.gnu.org/gnu; do
              if curl -fsSL --retry 3 -o "$(basename "$path")" "$base/$path"; then return 0; fi
              echo "Download from $base failed, trying next mirror"
            done
            return 1
          }

          echo "::group::ncurses $NCURSES_VERSION"
          fetch_gnu "ncurses/ncurses-$NCURSES_VERSION.tar.gz"
          tar -xzf "ncurses-$NCURSES_VERSION.tar.gz"
          (
            cd "ncurses-$NCURSES_VERSION"
            ./configure --host="$HOST" --prefix="$PREFIX" \
              --with-build-cc=gcc \
              --without-shared --with-normal --without-debug \
              --without-cxx --without-cxx-binding --without-ada \
              --without-manpages --without-progs --without-tests \
              --enable-widec --enable-overwrite --enable-const \
              --disable-db-install --disable-stripping \
              --with-default-terminfo-dir=/data/data/com.droidvim/files/usr/share/terminfo \
              "${lf[@]}"
            make -j"$JOBS"
            make install
          )
          echo "::endgroup::"

          echo "::group::libiconv $LIBICONV_VERSION"
          fetch_gnu "libiconv/libiconv-$LIBICONV_VERSION.tar.gz"
          tar -xzf "libiconv-$LIBICONV_VERSION.tar.gz"
          (
            cd "libiconv-$LIBICONV_VERSION"
            ./configure --host="$HOST" --prefix="$PREFIX" \
              --disable-shared --enable-static --disable-nls "${lf[@]}"
            make -j"$JOBS"
            make install
          )
          echo "::endgroup::"

          if [ "$ENABLE_NLS" = true ]; then
            echo "::group::libintl (gettext $GETTEXT_VERSION)"
            fetch_gnu "gettext/gettext-$GETTEXT_VERSION.tar.gz"
            tar -xzf "gettext-$GETTEXT_VERSION.tar.gz"
            (
              cd "gettext-$GETTEXT_VERSION/gettext-runtime"
              ./configure --host="$HOST" --prefix="$PREFIX" \
                --disable-shared --enable-static \
                --with-included-gettext --with-libiconv-prefix="$PREFIX" \
                --disable-java --disable-csharp --disable-c++ \
                --disable-libasprintf --disable-openmp --disable-curses \
                --without-emacs --without-git "${lf[@]}"
              # Only libintl is needed; fall back to the full build if the
              # intl directory can't be built on its own.
              if ! { make -C intl -j"$JOBS" && make -C intl install; }; then
                echo "::warning::Building libintl alone failed; building all of gettext-runtime"
                make -j"$JOBS"
                make install
              fi
            )
            test -f "$PREFIX/lib/libintl.a"
            echo "::endgroup::"
          fi

          if [ "$ENABLE_LUA" = true ]; then
            echo "::group::Lua $LUA_VERSION"
            curl -fsSL --retry 3 -o "lua-$LUA_VERSION.tar.gz" "https://www.lua.org/ftp/lua-$LUA_VERSION.tar.gz"
            tar -xzf "lua-$LUA_VERSION.tar.gz"
            lua_cflags="-O2 -fPIC -DLUA_COMPAT_5_3 -DLUA_USE_LINUX"
            # Lua has no configure script, so --disable-largefile can't reach
            # it. Its lprefix.h sets _FILE_OFFSET_BITS=64 unless the macro is
            # already defined, and on 32-bit ABIs that makes bionic map
            # fseeko/ftello to fseeko64/ftello64, which only exist from API 24.
            # Defining it as 32 keeps the plain fseeko/ftello, like the other
            # libraries and Vim built with --disable-largefile.
            if [ -n "$LARGEFILE_FLAG" ]; then
              lua_cflags+=" -D_FILE_OFFSET_BITS=32"
            fi
            make -C "lua-$LUA_VERSION/src" -j"$JOBS" liblua.a \
              CC="$CC" CFLAGS="$lua_cflags" \
              AR="$AR rc" RANLIB="$RANLIB"
            mkdir -p "$PREFIX/include" "$PREFIX/lib"
            cp "lua-$LUA_VERSION/src/"{lua.h,luaconf.h,lualib.h,lauxlib.h,lua.hpp} "$PREFIX/include/"
            cp "lua-$LUA_VERSION/src/liblua.a" "$PREFIX/lib/"
            echo "::endgroup::"
          fi

      - name: Configure Vim
        working-directory: vim
        run: |
          set -euo pipefail
          args=(
            --host="$HOST"
            --with-features=huge
            --enable-gui=no --without-x --without-wayland --disable-socketserver
            --enable-terminal --enable-channel --enable-multibyte --enable-cscope
            --disable-gpm --disable-sysmouse --disable-libsodium --disable-canberra
            --disable-selinux --disable-smack
            --with-tlib=ncursesw
            --with-compiledby="DroidVim GitHub Actions"
          )
          libs="-liconv"
          if [ -n "$LARGEFILE_FLAG" ]; then args+=("$LARGEFILE_FLAG"); fi
          if [ "$ENABLE_NLS" = true ]; then
            args+=(--enable-nls)
            libs="-lintl -liconv"
          else
            args+=(--disable-nls)
          fi
          if [ "$ENABLE_LUA" = true ]; then
            args+=(--enable-luainterp=yes --with-lua-prefix="$PREFIX")
          fi
          if [ -n "$EXTRA_CONFIGURE_FLAGS" ]; then
            read -r -a extra <<< "$EXTRA_CONFIGURE_FLAGS"
            args+=("${extra[@]}")
          fi

          # Answers for the checks configure cannot run when cross-compiling.
          export vim_cv_uname_output=Linux
          export vim_cv_uname_r_output=4.14
          export vim_cv_uname_m_output="$UNAME_M"
          export vim_cv_toupper_broken=no
          export vim_cv_terminfo=yes
          export vim_cv_tgetent=zero
          export vim_cv_getcwd_broken=no
          export vim_cv_stat_ignores_slash=no
          export vim_cv_memmove_handles_overlap=yes
          export vim_cv_bcopy_handles_overlap=yes
          export vim_cv_memcpy_handles_overlap=yes
          export vim_cv_timer_create=yes
          export vim_cv_timer_create_with_lrt=no
          export vim_cv_timer_create_works=yes
          # Keep pkg-config from picking up the build machine's libraries.
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          CFLAGS="-O2" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-L$PREFIX/lib" \
          LIBS="$libs" \
            ./configure "${args[@]}"

      - name: Build Vim and xxd
        working-directory: vim/src
        run: |
          set -euo pipefail
          make -j"$JOBS" vim
          make xxd/xxd

      - name: Build grep, diffutils and Universal Ctags
        if: env.BUILD_CMD_TOOLS == 'true'
        run: |
          set -euo pipefail
          mkdir -p tools out-tools
          cd tools
          lf=()
          if [ -n "$LARGEFILE_FLAG" ]; then lf=("$LARGEFILE_FLAG"); fi

          fetch_gnu() {
            local path=$1
            for base in https://ftpmirror.gnu.org https://ftp.gnu.org/gnu; do
              if curl -fsSL --retry 3 -o "$(basename "$path")" "$base/$path"; then return 0; fi
              echo "Download from $base failed, trying next mirror"
            done
            return 1
          }
          latest_gnu() {  # latest_gnu <name> <fallback version>
            local v
            v=$(curl -fsSL --retry 3 "https://ftp.gnu.org/gnu/$1/" \
                  | grep -oE "$1-[0-9]+(\.[0-9]+)+\.tar\.xz" \
                  | sed -E "s/^$1-(.*)\.tar\.xz$/\1/" | sort -V | tail -1) || true
            echo "${v:-$2}"
          }

          grep_v=$GREP_VERSION
          if [ "$grep_v" = latest ]; then grep_v=$(latest_gnu grep 3.12); fi
          diff_v=$DIFFUTILS_VERSION
          if [ "$diff_v" = latest ]; then diff_v=$(latest_gnu diffutils 3.12); fi
          ctags_v=$CTAGS_VERSION
          if [ "$ctags_v" = latest ]; then
            ctags_v=$(git ls-remote --tags --refs https://github.com/universal-ctags/ctags.git 'v*' \
                        | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1) || true
            ctags_v=${ctags_v:-6.2.1}
          fi
          echo "::notice::$ABI: grep $grep_v, diffutils $diff_v, Universal Ctags $ctags_v"

          # Answers for gnulib checks that can't run when cross-compiling.
          # The gnulib in grep/diffutils 3.12 (April 2025) predates the fixes
          # that let these two checks guess instead of failing. Both are true
          # for Android's libc.
          gl_cross=(gl_cv_func_strcasecmp_works=yes gl_cv_func_newlocale_works=yes)

          echo "::group::grep $grep_v"
          fetch_gnu "grep/grep-$grep_v.tar.xz"
          tar -xJf "grep-$grep_v.tar.xz"
          (
            cd "grep-$grep_v"
            ./configure --host="$HOST" --disable-nls --disable-perl-regexp "${lf[@]}" CFLAGS=-O2 "${gl_cross[@]}"
            make -C lib -j"$JOBS"
            # Build src's default target rather than just `grep`: only that
            # also creates the generated sources (BUILT_SOURCES).
            make -C src -j"$JOBS"
          )
          cp "grep-$grep_v/src/grep" ../out-tools/libgrep.so
          echo "::endgroup::"

          echo "::group::diffutils $diff_v"
          fetch_gnu "diffutils/diffutils-$diff_v.tar.xz"
          tar -xJf "diffutils-$diff_v.tar.xz"
          (
            cd "diffutils-$diff_v"
            ./configure --host="$HOST" --disable-nls "${lf[@]}" CFLAGS=-O2 "${gl_cross[@]}"
            make -C lib -j"$JOBS"
            # Build src's default target rather than just `diff`: only that
            # also creates the generated sources such as version.h
            # (BUILT_SOURCES). It builds cmp, diff3 and sdiff too.
            make -C src -j"$JOBS"
          )
          cp "diffutils-$diff_v/src/diff" ../out-tools/libdiff.so
          echo "::endgroup::"

          echo "::group::Universal Ctags $ctags_v"
          curl -fsSL --retry 3 -o ctags.tar.gz \
            "https://github.com/universal-ctags/ctags/releases/download/v$ctags_v/universal-ctags-$ctags_v.tar.gz"
          tar -xzf ctags.tar.gz
          (
            cd "universal-ctags-$ctags_v"
            ./configure --host="$HOST" CC_FOR_BUILD=gcc CFLAGS=-O2 \
              --disable-xml --disable-json --disable-yaml --disable-pcre2 \
              --disable-seccomp --disable-iconv --disable-readcmd "${lf[@]}" "${gl_cross[@]}"
            make -j"$JOBS" ctags
          )
          cp "universal-ctags-$ctags_v/ctags" ../out-tools/libctags.so
          echo "::endgroup::"

      - name: Strip, check and collect binaries
        run: |
          set -euo pipefail
          mkdir -p out
          cp vim/src/vim out/libvim.default.so
          cp vim/src/xxd/xxd out/libxxd.so
          if [ "$BUILD_CMD_TOOLS" = true ]; then cp out-tools/*.so out/; fi
          "$STRIP" --strip-unneeded out/*.so
          file out/*.so
          for f in out/*.so; do
            needed=$("$READELF" -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p')
            echo "$(basename "$f") needs: $(echo "$needed" | tr '\n' ' ')"
            # Anything besides Android system libraries would have to be
            # shipped separately, so treat it as a build error.
            unexpected=$(echo "$needed" | grep -vE '^(libc|libm|libdl|liblog)\.so$' || true)
            if [ -n "$unexpected" ]; then
              echo "::error::$(basename "$f") links against non-system libraries: $unexpected"
              exit 1
            fi
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: vim-android-${{ matrix.abi }}
          path: out/*.so
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.abi }}
          path: |
            vim/src/auto/config.log
            build/**/config.log
            tools/**/config.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build the runtime files (syntax, docs + helptags, translations, ...)
  #    natively from the same patched source and split them the way DroidVim
  #    installs them.
  # ---------------------------------------------------------------------------
  vim-runtime:
    needs: prepare-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vim-src

      - name: Unpack source
        run: tar -xzf vim-src.tar.gz

      - name: Install host build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q libncurses-dev gettext

      - name: Build and install Vim into a staging directory
        working-directory: vim
        run: |
          set -euo pipefail
          ./configure --prefix=/usr --with-features=huge --enable-gui=no --without-x \
            --without-wayland --disable-socketserver \
            --enable-nls --with-tlib=ncurses --disable-gpm --disable-canberra --disable-libsodium
          make -j"$(nproc)"
          make install DESTDIR="$GITHUB_WORKSPACE/stage"

      - name: Create runtime archives
        run: |
          set -euo pipefail
          rtdirs=(stage/usr/share/vim/vim[0-9]*)
          [ ${#rtdirs[@]} -eq 1 ] && [ -d "${rtdirs[0]}" ] || { echo "::error::Vim runtime directory not found"; exit 1; }
          mkdir -p rt out
          cp -a "${rtdirs[0]}" rt/runtime
          tarxz() { tar --format=gnu --owner=0 --group=0 --numeric-owner -C rt -cJf "$@"; }
          for sub in lang spell syntax doc tutor; do
            tarxz "out/runtime$sub" "runtime/$sub"
          done
          tarxz out/runtime \
            --exclude=runtime/lang --exclude=runtime/spell --exclude=runtime/syntax \
            --exclude=runtime/doc --exclude=runtime/tutor runtime
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: vim-runtime
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. bash, zip/unzip, busybox, proot and am with termux-packages, built for
  #    the com.droidvim app directory, then repackaged in DroidVim's format.
  #    These need Android 7.0 (API 24) or newer, like all Termux builds.
  # ---------------------------------------------------------------------------
  termux-payload:
    needs: prepare-source
    if: needs.prepare-source.outputs.build_termux_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            termux_arch: aarch64
            arch: arm64
          - abi: armeabi-v7a
            termux_arch: arm
            arch: arm
          - abi: x86_64
            termux_arch: x86_64
            arch: x86_64
          - abi: x86
            termux_arch: i686
            arch: x86
    env:
      ABI: ${{ matrix.abi }}
      TERMUX_ARCH: ${{ matrix.termux_arch }}
      DV_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: droidvim

      - name: Fetch termux-packages
        id: tp
        run: |
          set -euo pipefail
          git init -q termux-packages
          git -C termux-packages fetch -q --depth 1 https://github.com/termux/termux-packages.git "$TERMUX_PACKAGES_REF"
          git -C termux-packages checkout -q FETCH_HEAD
          sha=$(git -C termux-packages rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git -C termux-packages log -1 --format='termux-packages %H (%cs)'

      - name: Restore cached payload
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: payload-out
          key: termux-payload-${{ matrix.abi }}-${{ steps.tp.outputs.sha }}-${{ env.DROIDVIM_PACKAGE }}-git${{ env.WITH_GIT }}-py${{ env.WITH_PYTHON }}-${{ hashFiles('droidvim/.github/droidvim-pack.py') }}

      - name: Free disk space for the Termux build container
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Build packages with termux-packages
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: termux-packages
        run: |
          set -euo pipefail
          # Build everything for /data/data/com.droidvim/files/usr instead
          # of Termux's own directory.
          sed -i -E "s/^TERMUX_APP__PACKAGE_NAME=.*/TERMUX_APP__PACKAGE_NAME=\"$DROIDVIM_PACKAGE\"/" scripts/properties.sh
          if ! grep -q "^TERMUX_APP__PACKAGE_NAME=\"$DROIDVIM_PACKAGE\"" scripts/properties.sh; then
            echo "::error::Could not set the app package name in termux-packages' scripts/properties.sh"
            exit 1
          fi

          # Trim recipes to what DroidVim needs, so termux-packages can
          # build each package's dependencies itself without pulling in far
          # more than that.
          # - bash: termux-tools is Termux's app scripts (and pulls in
          #   coreutils, curl, util-linux, ...), not needed here.
          sed -i -E '/^TERMUX_PKG_DEPENDS=/ s/, *termux-tools( *\([^)]*\))?//' packages/bash/build.sh
          if grep -E '^TERMUX_PKG_DEPENDS=' packages/bash/build.sh | grep -q termux-tools; then
            echo "::error::Could not remove termux-tools from packages/bash/build.sh (termux-packages changed?)"
            exit 1
          fi
          # - Sub-packages DroidVim doesn't ship (Python's Tkinter, git's GUIs
          #   and svn bridge): Termux builds their dependencies together with
          #   the parent package (Tk + X11, Subversion + Perl). Keep the files,
          #   since other recipes refer to these sub-packages, but drop their
          #   dependencies.
          for f in packages/python/python-tkinter.subpackage.sh \
                   packages/git/git-gui.subpackage.sh \
                   packages/git/git-gitk.subpackage.sh \
                   packages/git/git-svn.subpackage.sh; do
            if [ -f "$f" ]; then
              sed -i -E 's/^TERMUX_SUBPKG_DEPENDS=.*/TERMUX_SUBPKG_DEPENDS=""/' "$f"
            fi
          done
          # - python: Tkinter would need Tk and X11, which DroidVim lacks.
          if [ "$WITH_PYTHON" = true ]; then
            sed -i -E '/^TERMUX_PKG_BUILD_DEPENDS=/ { s/, *tk *,/,/; s/"tk *, */"/; s/, *tk"/"/; s/"tk"/""/ }' packages/python/build.sh
            sed -i -E 's/ _tkinter / /' packages/python/build.sh
            if grep -qE '^TERMUX_PKG_BUILD_DEPENDS=.*\btk\b| _tkinter ' packages/python/build.sh; then
              echo "::error::Could not remove Tkinter from packages/python/build.sh (termux-packages changed?)"
              exit 1
            fi
          fi

          ./scripts/run-docker.sh true
          build() { ./scripts/run-docker.sh ./build-package.sh -a "$TERMUX_ARCH" "$@"; }
          optional() {  # optional <what> <packages...>
            local what=$1; shift
            if ! build "$@"; then
              echo "::warning::$ABI: building $what failed; the APK will not include it"
              echo "PARTIAL=true" >> "$GITHUB_ENV"
            fi
          }
          build bash
          optional "zip/unzip" zip unzip
          optional "busybox" busybox
          optional "proot" proot
          optional "am" termux-am
          if [ "$WITH_GIT" = true ]; then optional "git" git; fi
          if [ "$WITH_PYTHON" = true ]; then
            optional "Python" python
            optional "pip" python-pip
          fi
          ls -l output

      - name: Repackage for DroidVim
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 droidvim/.github/droidvim-pack.py --debs termux-packages/output \
            --abi "$ABI" --arch "$DV_ARCH" --package "$DROIDVIM_PACKAGE" --out payload-out
          find payload-out -type f | sort

      - name: Save payload to cache
        if: steps.cache.outputs.cache-hit != 'true' && env.PARTIAL != 'true'
        uses: actions/cache/save@v4
        with:
          path: payload-out
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: termux-payload-${{ matrix.abi }}
          path: payload-out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. Put everything into the DroidVim tree and build the APK.
  # ---------------------------------------------------------------------------
  apk:
    needs: [prepare-source, vim-binary, vim-runtime, termux-payload]
    # Runs when termux-payload was skipped (Termux tools not built) too.
    if: >-
      !cancelled() &&
      needs.prepare-source.result == 'success' &&
      needs.vim-binary.result == 'success' &&
      needs.vim-runtime.result == 'success' &&
      (needs.termux-payload.result == 'success' || needs.termux-payload.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      VIM_VERSION: ${{ needs.prepare-source.outputs.vim_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the DroidVim tree is complete
        run: |
          if ! bash .github/check-payload.sh; then
            echo "::error::Cannot build the APK: DroidVim resources are missing from this repository (listed in the log). Copy them back from your full DroidVim checkout and push again. The binaries of this run are available as the vim-android-*, vim-runtime and termux-payload-* artifacts."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: vim-android-*
          path: dl

      - uses: actions/download-artifact@v4
        with:
          name: vim-runtime
          path: dl/vim-runtime

      - uses: actions/download-artifact@v4
        if: env.BUILD_TERMUX_TOOLS == 'true'
        with:
          pattern: termux-payload-*
          path: dl

      - name: Install the built files into the DroidVim source tree
        run: |
          set -euo pipefail
          shopt -s nullglob
          abis=(arm64-v8a armeabi-v7a x86_64 x86)
          # Source folders the droidvim flavor builds from (term/build.gradle).
          lib_dirs=(main droidvim vim term-bash cmd-tools zip unzip proot)
          res_dirs=(main droidvim vim)

          # put_lib <file> <abi> <name> <dir>: replace the library wherever the
          # droidvim flavor already has it (two copies in different jniLibs
          # folders would break the build), otherwise add it to term/src/<dir>.
          put_lib() {
            local src=$1 abi=$2 name=$3 dir=$4 hits=() d
            for d in "${lib_dirs[@]}"; do
              if [ -f "term/src/$d/jniLibs/$abi/$name" ]; then hits+=("term/src/$d/jniLibs/$abi/$name"); fi
            done
            if [ ${#hits[@]} -eq 0 ]; then
              mkdir -p "term/src/$dir/jniLibs/$abi"
              hits=("term/src/$dir/jniLibs/$abi/$name")
            fi
            for h in "${hits[@]}"; do cp "$src" "$h"; done
          }
          # put_raw <file> <name> <dir>: raw resources are matched by name
          # without extension, keeping the file name the repo already uses.
          put_raw() {
            local src=$1 name=$2 dir=$3 hits=() f base d
            for d in "${res_dirs[@]}"; do
              for f in "term/src/$d/res/raw/"*; do
                base=$(basename "$f")
                if [ "${base%%.*}" = "$name" ]; then hits+=("$f"); fi
              done
            done
            if [ ${#hits[@]} -eq 0 ]; then
              mkdir -p "term/src/$dir/res/raw"
              hits=("term/src/$dir/res/raw/$name")
            fi
            for h in "${hits[@]}"; do cp "$src" "$h"; done
          }

          echo "::group::Vim, xxd, grep, diff, ctags"
          for dir in dl/vim-android-*; do
            abi=${dir#dl/vim-android-}
            put_lib "$dir/libvim.default.so" "$abi" libvim.default.so vim
            put_lib "$dir/libxxd.so" "$abi" libxxd.so vim
            for tool in libgrep.so libdiff.so libctags.so; do
              if [ -f "$dir/$tool" ]; then put_lib "$dir/$tool" "$abi" "$tool" cmd-tools; fi
            done
            echo "$abi done"
          done
          echo "::endgroup::"

          echo "::group::Vim runtime"
          for name in runtime runtimelang runtimespell runtimesyntax runtimedoc runtimetutor; do
            put_raw "dl/vim-runtime/$name" "$name" vim
          done
          echo "::endgroup::"

          echo "::group::Termux-built tools"
          for dir in dl/termux-payload-*; do
            abi=${dir#dl/termux-payload-}
            # Replace each bundle as a whole; the number of files changes
            # between versions.
            for bdir in "$dir"/bundles/*; do
              bundle=$(basename "$bdir")
              for d in "${lib_dirs[@]}"; do
                rm -f "term/src/$d/jniLibs/$abi/lib$bundle.tar.so" \
                      "term/src/$d/jniLibs/$abi/lib$bundle"[0-9][0-9][0-9][0-9][0-9].so
              done
              mkdir -p "term/src/$bundle/jniLibs/$abi"
              cp "$bdir/$abi"/* "term/src/$bundle/jniLibs/$abi/"
              echo "$abi: $bundle ($(find "$bdir/$abi" -type f | wc -l) files)"
            done
            for f in "$dir"/libs/*/"$abi"/*; do
              src_dir=$(basename "$(dirname "$(dirname "$f")")")
              put_lib "$f" "$abi" "$(basename "$f")" "$src_dir"
              echo "$abi: $(basename "$f")"
            done
            for f in "$dir"/raw/*; do
              put_raw "$f" "$(basename "$f")" main
            done
          done
          if [ "$BUILD_TERMUX_TOOLS" = true ]; then
            # The app re-installs the shell tools when this stamp changes.
            date -u '+%Y/%m/%d %H:%M:%S' > version_bash.tmp
            put_raw version_bash.tmp version_bash main
            rm version_bash.tmp
          fi
          echo "::endgroup::"

          # has_lib <abi> <name>: does the droidvim flavor have this library?
          has_lib() {
            local d
            for d in "${lib_dirs[@]}"; do
              if [ -f "term/src/$d/jniLibs/$1/$2" ]; then return 0; fi
            done
            return 1
          }

          echo "::group::Helper scripts"
          # The scripts in payload/scripts match the Termux tools built here
          # (am, busybox); with prebuilt tools, keep the repo's own scripts
          # and only add missing ones.
          for f in payload/scripts/*/lib*.so; do
            dir=$(basename "$(dirname "$f")")
            name=$(basename "$f")
            for abi in "${abis[@]}"; do
              if [ "$BUILD_TERMUX_TOOLS" = true ] || ! has_lib "$abi" "$name"; then
                put_lib "$f" "$abi" "$name" "$dir"
              fi
            done
            echo "$dir/$name"
          done
          echo "::endgroup::"

          # With building switched off, say which prebuilt tools are missing.
          for abi in "${abis[@]}"; do
            missing=()
            if [ "$BUILD_CMD_TOOLS" != true ]; then
              for lib in libgrep.so libdiff.so libctags.so; do
                has_lib "$abi" "$lib" || missing+=("$lib")
              done
            fi
            if [ "$BUILD_TERMUX_TOOLS" != true ]; then
              for lib in libterm-bash.tar.so libbusybox.so libzip.tar.so libunzip.tar.so libproot.so; do
                has_lib "$abi" "$lib" || missing+=("$lib")
              done
            fi
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::warning::$abi: no prebuilt ${missing[*]} in the repository and building them is switched off; the APK will lack those tools"
            fi
          done

          echo "Native libraries per ABI:"
          for abi in "${abis[@]}"; do
            echo "  $abi: $(find term/src -path "*/jniLibs/$abi/*.so" -type f | wc -l)"
          done

      - name: Tag the app version with the Vim version
        run: |
          set -euo pipefail
          # The installer re-extracts its files when versionName changes, so
          # this makes an upgraded app install the new runtime.
          perl -pi -e "s/('versionName'\s*:\s*')([^']*)'/\${1}\${2}-vim${VIM_VERSION}'/" build.gradle
          grep -n "'versionName'" build.gradle
          # Keep the in-app "what's new" text in sync with the Vim version.
          perl -pi -e 's/(WHATS_NEW.*?\* Vim )[0-9]+(?:\.[0-9]+)*/${1}$ENV{VIM_VERSION}/' term/build.gradle
          grep -n 'WHATS_NEW' term/build.gradle

      - name: Set up signing key (if repository secrets exist)
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE" ]; then
            mkdir -p term/keystore
            echo "$KEYSTORE" | base64 -di > term/keystore/keystore_droidvim.jks
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "Building a signed release APK"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "::notice::No KEYSTORE secret; building a debug-signed APK"
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          task="assembleDroidvim${BUILD_TYPE^}"
          ./gradlew --no-daemon "$task"
          find term/build/outputs/apk -name '*.apk' -exec ls -l {} +

      - uses: actions/upload-artifact@v4
        with:
          name: DroidVim-vim${{ env.VIM_VERSION }}-${{ env.BUILD_TYPE }}
          path: term/build/outputs/apk/droidvim/**/*.apk
          if-no-files-found: error
